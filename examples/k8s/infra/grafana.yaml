apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    app: grafana
data:
  grafana.ini: |
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    check_for_plugin_updates = false
    feedback_links_enabled = false

    [news]
    news_feed_enabled = false

    [auth.anonymous]
    enabled = true
    org_role = Viewer

    [auth]
    disable_login_form = true
    disable_signout_menu = true

    [alerting]
    enabled = false

    [unified_alerting]
    enabled = false

    [log]
    mode = console
    level = warn

    [server]
    enable_gzip = true

    [database]
    wal = false

    [dashboards]
    default_home_dashboard_path = /etc/grafana/provisioning/dashboards/lag-scaler.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.default.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: lag-scaler
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards
  lag-scaler.json: |
    {
      "title": "Kafka Persistent Lag Scaler",
      "uid": "lag-scaler",
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "title": "Consumer Count vs. Lag",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 12 },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 1.5, "connectNulls": true }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Consumer Count" },
                "properties": [{ "id": "custom.axisPlacement", "value": "left" }]
              },
              {
                "matcher": { "id": "byName", "options": "Consumer Lag" },
                "properties": [{ "id": "custom.axisPlacement", "value": "right" }]
              }
            ]
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kafka_lag_scaler_consumer_count",
              "legendFormat": "Consumer Count",
              "interval": "5s"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kafka_lag_scaler_total_lag",
              "legendFormat": "Consumer Lag",
              "interval": "5s"
            }
          ]
        },
        {
          "id": 2,
          "title": "Scaler Triggered",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "fillOpacity": 80, "connectNulls": false }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "increase(kafka_lag_scaler_activations_total[30s]) > 0",
              "legendFormat": "triggered",
              "interval": "10s"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30301
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana-oss:11.4.0
          env:
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/lag-scaler.json
              subPath: lag-scaler.json
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: data
          emptyDir: {}
