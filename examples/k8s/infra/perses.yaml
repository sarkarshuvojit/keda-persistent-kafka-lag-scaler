apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-config
  labels:
    app: perses
data:
  config.yaml: |
    database:
      file:
        folder: /var/lib/perses/data
        extension: yaml
    provisioning:
      folders:
        - /etc/perses/provisioning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-provisioning
  labels:
    app: perses
data:
  project.yaml: |
    kind: "Project"
    metadata:
      name: lag-scaler
    spec:
      display:
        name: "Kafka Persistent Lag Scaler"
  datasource.yaml: |
    kind: "GlobalDatasource"
    metadata:
      name: prometheus
    spec:
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          proxy:
            kind: HTTPProxy
            spec:
              url: http://prometheus.default.svc.cluster.local:9090
              allowedEndpoints:
                - endpointPattern: /api/v1/labels
                  method: POST
                - endpointPattern: /api/v1/series
                  method: POST
                - endpointPattern: /api/v1/metadata
                  method: GET
                - endpointPattern: /api/v1/query
                  method: POST
                - endpointPattern: /api/v1/query_range
                  method: POST
                - endpointPattern: /api/v1/label/([a-zA-Z0-9_-]+)/values
                  method: GET
  dashboard.yaml: |
    kind: Dashboard
    metadata:
      name: lag-scaler
      project: lag-scaler
    spec:
      display:
        name: "Kafka Persistent Lag Scaler"
      duration: 15m
      refreshInterval: 10s
      panels:
        consumerLag:
          kind: Panel
          spec:
            display:
              name: "Consumer Lag"
            plugin:
              kind: TimeSeriesChart
              spec:
                visual:
                  connectNulls: true
                  lineWidth: 1.5
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: "kafka_lag_scaler_total_lag"
                      minStep: "5s"
        scalerTriggered:
          kind: Panel
          spec:
            display:
              name: "Scaler Triggered"
            plugin:
              kind: TimeSeriesChart
              spec:
                visual:
                  display: bar
                  connectNulls: false
                legend:
                  position: "bottom"
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: "increase(kafka_lag_scaler_activations_total[30s]) > 0"
                      minStep: "10s"
                      seriesNameFormat: "triggered"
        consumerCount:
          kind: Panel
          spec:
            display:
              name: "Consumer Count"
            plugin:
              kind: TimeSeriesChart
              spec:
                visual:
                  connectNulls: true
                  lineWidth: 1.5
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: "kafka_lag_scaler_consumer_count"
                      minStep: "5s"
      layouts:
        - kind: Grid
          spec:
            items:
              - x: 0
                y: 0
                width: 24
                height: 8
                content:
                  $ref: "#/spec/panels/consumerLag"
              - x: 0
                y: 8
                width: 24
                height: 2
                content:
                  $ref: "#/spec/panels/scalerTriggered"
              - x: 0
                y: 10
                width: 24
                height: 8
                content:
                  $ref: "#/spec/panels/consumerCount"
---
apiVersion: v1
kind: Service
metadata:
  name: perses
  labels:
    app: perses
spec:
  type: NodePort
  selector:
    app: perses
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perses
  labels:
    app: perses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perses
  template:
    metadata:
      labels:
        app: perses
    spec:
      containers:
        - name: perses
          image: docker.io/persesdev/perses:v0.53.1
          args:
            - --config=/etc/perses/config.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/perses/config.yaml
              subPath: config.yaml
            - name: provisioning
              mountPath: /etc/perses/provisioning
            - name: data
              mountPath: /var/lib/perses/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: perses-config
        - name: provisioning
          configMap:
            name: perses-provisioning
        - name: data
          emptyDir: {}
